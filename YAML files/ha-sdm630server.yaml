switch:
  - platform: template
    name: "_Logging Modbus server"
    icon: "mdi:bug"
    optimistic: true
    turn_on_action:
      - logger.set_level:
          level: VERBOSE
          tag: modbus_server
    turn_off_action:
      - logger.set_level:
          level: WARN
          tag: modbus_server
    entity_category: config          

  - platform: template
    name: "_Logging UART raw byte"
    icon: "mdi:chip"
    optimistic: true
    turn_on_action:
      - logger.set_level:
          level: DEBUG
          tag: uart_debug
    turn_off_action:
      - logger.set_level:
          level: WARN
          tag: uart_debug
    entity_category: config
          
   
text_sensor:
