# =============================================================================
# ESPHome ESP32-C6 config: SDM630 Modbus-server emulator gevoed door P1-data uit Home Assistant.
# Eastron SDM630 Modbus register map is basis voor alle berekeningen en registeradressen.
# Deze versie is specifiek voor Ecoforest/Eplucon warmtepomp. 
# 
# Uniek feature is zijn de diagnostic switches waarmee de opgevraagde Modbus-registers 
# en de ruwe UART-bits op de RS485-bus live in de ESPHome-log zichtbaar gemaakt kunnen worden.
#
# 
# Er worden slechts 4 waarden door  Eplucon gebruikt : 
# Door Eplucon wordt de waarde van het totaal vermogen (0x0034) omgekeerd geïnterpreteerd.
# Register	Betekenis	
# 0x34	Total system power - som actief vermogen L1+L2+L3 (W), bidirectioneel: + = import, - = export	
# 0x46	Frequency - netfrequentie (Hz)	Eastron SDM630 Modbus register map
# 0x48	Total import active energy - cumulatief verbruik (kWh)	Eastron SDM630 Modbus register map
# 0x4A	Total export active energy - cumulatief teruglevering (kWh)	Eastron SDM630 Modbus register map
#
#
substitutions:
  device_name: "ha-sdm630server"
  device_friendlyname: HA-SDM630server
  device_description: HA to emulate SDM630
  version: "v26.09.29"
  # Modbus-serveradres waaronder dit apparaat zich als SDM630 voordoet.
  # Voor Eplucon Th-touch kWh meter moet dit zijn adres 5,  19200 baud, 8N2
  modbus_address: "5"
  baudrate: "19200"   # SDM630-fabrieksdefault: 9600 baud, 8N1    8N1 is geen parameter hier.
  stopbits: "2"
#
# WAT DOET DIT?
#   De ESP32-C6 fungeert als Modbus RTU SLAVE (server) op de RS485-bus en
#   beantwoordt registeraanvragen alsof hij een echte Eastron SDM630
#   driefasenmeter is. De waarden die hij teruggeeft komen niet van eigen
#   CT's/spanningsmeting, maar worden live opgehaald uit sensoren die je
#   P1-meter integratie (bv. de ingebouwde "DSMR Slimme meter" integratie)
#   al in Home Assistant heeft aangemaakt.
#
#   Typisch gebruikt om een omvormer (Growatt, Deye, SolaX, ...) die een
#   Eastron SDM630 als "smart meter"/terugleververmogen-sensor verwacht,
#   te voeden met de data van je bestaande P1-meter i.p.v. een tweede,
#   fysieke SDM630 te moeten bijplaatsen.
#
# VOORDAT JE FLASHT - PAS DIT AAN:
#   1. secrets.yaml aanmaken (zie secrets.yaml.example) met wifi/api/ota.
#   2. De entity_id's in het blok "substitutions" hieronder aanpassen naar
#      de ECHTE entity id's van jouw P1-integratie. Zoek ze op via
#      Instellingen > Apparaten & Diensten > Entiteiten (of Ontwikkelaarshulp-
#      middelen > Statussen) in Home Assistant. De namen hieronder zijn de
#      standaardnamen van de ingebouwde HA "DSMR Slimme meter"-integratie,
#      maar kunnen per installatie/apparaatnaam verschillen.
#   3. modbus_address en baudrate hieronder zetten op wat jouw omvormer verwacht
#      (Growatt verwacht vaak adres 2, SolaX/Deye vaak adres 1 - check de
#      handleiding van je omvormer/laadpaal).
#   4. uart_tx_pin/uart_rx_pin/uart_flowctrl_pin aanpassen aan hoe je de RS485-module hebt
#      bedraad op je ESP32-C6 board.
#   5. Let op: current_phase_l1/l2/l3 en voltage_phase_l1/l2/l3 zijn bij de
#      HA DSMR-integratie alleen beschikbaar als je meter DSMR-versie 5.0+
#      spreekt. Heeft jouw meter dat niet, vervang die "homeassistant"
#      sensoren dan door vaste/berekende waarden (bv. 230 V nominaal en
#      current = power / 230).
#
# BEPERKINGEN:
#   - Een P1-telegram bevat geen netfrequentie, blindvermogen (VAr) of
#     arbeidsfactor (cos phi). Die registers worden daarom hieronder op
#     vaste/benaderde waarden gezet (50.0 Hz, 0 VAr, pf = 1.0).
#   - Lijn-lijnspanningen (200/202/204) zijn een wiskundige benadering
#     (gemiddelde fasespanning x sqrt(3)), geen echte meting.
#   - Dit is een emulatie voor monitoring/load-management doeleinden, GEEN
#     MID-gekeurde meter. Gebruik dit niet voor facturatie aan derden.
# =============================================================================

  # Internal connections COSMAX13487EESA (MAX13487E‑compatible) — Half‑duplex RS485/RS422 transceiver with automatic direction control
  # ESP32‑C6 PIN	RS485 TRANSCEIVER PIN
  # GPIO4	nSHDN  Shutdown. Drive SHDN high to let the device operate in normal operation. Drive SHDN low to put the part in shutdown.
  # GPIO5	nEN Receiver Output Enable. Drive RE low to enable the RO. Drive RE high to let the AutoDirection circuit control the receiver.
  # GPIO6	RO Receiver Output. When receiver is enabled and V(A) - V(B) > +200mV, RO is high. If V(A) - V(B)< -200mV, RO is low.
  # GPIO7	DI Driver Input. Drive DI low to force noninverting output low and inverting output high. Drive DI high to
  # force noninverting output high and inverting output low. DI is an input to the internal state machine that automatically enables and disables the driver.
  # directly coded on UART :
  # uart_tx_pin: "GPIO7"
  # uart_rx_pin: "GPIO6"
  # uart_flowctrl_pin: "GPIO5"  


  # --- Entity id's van je P1-meter in Home Assistant (PAS AAN!) ---
  ha_power_consumption: sensor.p1ultra_power_delivered          # W, totaal verbruik
  ha_power_production: sensor.p1ultra_power_returned            # W, totaal teruglevering
  ha_power_consumption_l1: sensor.p1ultra_power_delivered_l1
  ha_power_consumption_l2: sensor.p1ultra_power_delivered_l2
  ha_power_consumption_l3: sensor.p1ultra_power_delivered_l3
  ha_power_production_l1: sensor.p1ultra_power_returned_l1
  ha_power_production_l2: sensor.p1ultra_power_returned_l2
  ha_power_production_l3: sensor.p1ultra_power_returned_l3
  ha_voltage_l1: sensor.p1ultra_voltage_i1
  ha_voltage_l2: sensor.p1ultra_voltage_i2
  ha_voltage_l3: sensor.p1ultra_voltage_i3
  ha_current_l1: sensor.p1ultra_stroom_i1
  ha_current_l2: sensor.p1ultra_stroom_i2
  ha_current_l3: sensor.p1ultra_stroom_i3
  ha_energy_consumption_t1: sensor.p1ultra_energy_delivered_t1  # kWh
  ha_energy_consumption_t2: sensor.p1ultra_energy_delivered_t2  # kWh
  ha_energy_production_t1: sensor.p1ultra_energy_returned_t1    # kWh
  ha_energy_production_t2: sensor.p1ultra_energy_returned_t2    # kWh



esphome:
  name: ${device_name}
  comment: "${device_description}"
  name_add_mac_suffix: false
  friendly_name: "${device_friendlyname}"

esp32:
  # board: esp32-c6-devkitc-1
  flash_size: 4MB
  variant: ESP32C6
  # toolchain: esp-idf  # or 'platformio' (default)
  framework:
    type: esp-idf

# Enable logging
# level hier is het GECOMPILEERDE plafond: logger.set_level (bv. via de
# "_Debug logging AAN/UIT" knoppen) kan dit runtime alleen omlaag/omhoog
# zetten TOT AAN dit plafond, niet erboven. Staat dit op INFO, dan worden
# ESP_LOGD/ESP_LOGW-regels bij het compileren volledig weggelaten en kan
# geen enkele runtime-actie ze nog zichtbaar maken. Zet daarom DEBUG (of
# VERY_VERBOSE) tijdens troubleshooten; zet terug naar INFO en herflash
# zodra alles werkt om flash-ruimte/CPU te besparen.

logger:
  level: VERBOSE
  initial_level: WARN
  baud_rate: 0
  logs:
    modbus: ERROR
    modbus_server: ERROR
    uart_debug: ERROR


# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  min_auth_mode: WPA2
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_friendlyname} Fallback"
    password: !secret wifi_password

web_server:
  # Toont ook 'internal: true'-entiteiten op de lokale webpagina, zonder
  # ze aan Home Assistant/de API bloot te stellen (voorkomt extra
  # entiteiten in HA voor de ruwe HA-bronsensoren hieronder).
  include_internal: true
  version: 3

captive_portal:


output:
  # Heartbeat status LED
  - platform: gpio
    id: statusLED
    pin: GPIO19
  - platform: gpio
    id: SHDN_PIN # Shutdown RS-485 chip
    pin:
      number: GPIO4
      inverted: true

# -----------------------------------------------------------------------
# RS485 / Modbus server
# -----------------------------------------------------------------------
uart:
  id: uart_modbus
  tx_pin: GPIO7
  rx_pin: GPIO6
  baud_rate: ${baudrate}
  stop_bits: ${stopbits}
  parity: NONE
  flow_control_pin: GPIO5
  # rx_timeout: 20
  debug:
    direction: BOTH
    after:
      timeout: 100ms
  rx_buffer_size: 1024B
  
modbus:
  - uart_id: uart_modbus
    id: modbus_bus
    role: server

modbus_server:
  - modbus_id: modbus_bus
    address: ${modbus_address}
    registers:
      # ---- Spanning per fase (V) - Input Registers, FC04 ----
      - address: 0x0000
        value_type: FP32
        read_lambda: return id(voltage_l1).state;
      - address: 0x0002
        value_type: FP32
        read_lambda: return id(voltage_l2).state;
      - address: 0x0004
        value_type: FP32
        read_lambda: return id(voltage_l3).state;

      # ---- Stroom per fase (A) ----
      - address: 0x0006
        value_type: FP32
        read_lambda: return id(current_l1).state;
      - address: 0x0008
        value_type: FP32
        read_lambda: return id(current_l2).state;
      - address: 0x000A
        value_type: FP32
        read_lambda: return id(current_l3).state;

      # ---- Actief vermogen per fase (W); positief = verbruik/import ----
      - address: 0x000C
        value_type: FP32
        read_lambda: return id(active_power_l1).state;
      - address: 0x000E
        value_type: FP32
        read_lambda: return id(active_power_l2).state;
      - address: 0x0010
        value_type: FP32
        read_lambda: return id(active_power_l3).state;

      # ---- Schijnbaar vermogen per fase (VA); benaderd als |P| (pf=1) ----
      - address: 0x0012
        value_type: FP32
        read_lambda: return fabs(id(active_power_l1).state);
      - address: 0x0014
        value_type: FP32
        read_lambda: return fabs(id(active_power_l2).state);
      - address: 0x0016
        value_type: FP32
        read_lambda: return fabs(id(active_power_l3).state);

      # ---- "Net power" per fase - OP ECHTE SDM630-HARDWARE ZIJN DIT GEEN
      # blindvermogen (VAr)-registers, ondanks wat generieke online
      # registertabellen suggereren. Bevestigd met een tweede ESP32 die
      # succesvol tegen een echte Eastron SDM630 praat (modbus_controller
      # client, registers hier "Net2 Power I1/I2/I3" genoemd): de waarde
      # spiegelt het actief vermogen per fase. Vandaar hier hetzelfde als
      # 0x000C/0x000E/0x0010 in plaats van een vaste 0.
      - address: 0x0018
        value_type: FP32
        read_lambda: return id(active_power_l1).state;
      - address: 0x001A
        value_type: FP32
        read_lambda: return id(active_power_l2).state;
      - address: 0x001C
        value_type: FP32
        read_lambda: return id(active_power_l3).state;

      # ---- Richting per fase (+1.0 = import, -1.0 = export) - OOK HIER:
      # op echte SDM630-hardware is dit geen 0-1 arbeidsfactor maar een
      # +1/-1 richtingsindicator (bevestigd door dezelfde referentieclient,
      # die deze registers "Direction L1/L2/L3" noemt met
      # accuracy_decimals: 0). Afgeleid uit het teken van het actief
      # vermogen per fase i.p.v. een vaste 1.0.
      - address: 0x001E
        value_type: FP32
        read_lambda: |-
          return id(active_power_l1).state >= 0.0f ? 1.0f : -1.0f;
      - address: 0x0020
        value_type: FP32
        read_lambda: |-
          return id(active_power_l2).state >= 0.0f ? 1.0f : -1.0f;
      - address: 0x0022
        value_type: FP32
        read_lambda: |-
          return id(active_power_l3).state >= 0.0f ? 1.0f : -1.0f;

      # ---- Gemiddelde fasespanning (V) ----
      - address: 0x002A
        value_type: FP32
        read_lambda: |-
          return (id(voltage_l1).state + id(voltage_l2).state + id(voltage_l3).state) / 3.0f;

      # ---- Gemiddelde stroom (A) ----
      - address: 0x002E
        value_type: FP32
        read_lambda: |-
          return (id(current_l1).state + id(current_l2).state + id(current_l3).state) / 3.0f;

      # ---- Totale stroom (som van de 3 fasen, A) ----
      - address: 0x0030
        value_type: FP32
        read_lambda: |-
          return id(current_l1).state + id(current_l2).state + id(current_l3).state;

      # ---- Totaal actief vermogen (W); positief = import, negatief = export ----
      # ---- Aangepast in calculatie voor EPLUCON ; positief = export, negatief = import ----
      - address: 0x0034
        value_type: FP32
        read_lambda: return id(total_active_power).state;

      # ---- Totaal schijnbaar vermogen (VA); benaderd als |P_totaal| ----
      - address: 0x0038
        value_type: FP32
        read_lambda: return fabs(id(total_active_power).state);

      # ---- Totaal blindvermogen (VAr) - 0, zie opmerking hierboven ----
      - address: 0x003C
        value_type: FP32
        read_lambda: return 0.0f;

      # ---- Richting totaal (+1.0 = import, -1.0 = export) - zie
      # opmerking bij 0x001E hierboven; ook hier geen arbeidsfactor maar
      # een teken-indicator, nu afgeleid uit het totale actief vermogen.
      - address: 0x003E
        value_type: FP32
        read_lambda: |-
          return id(total_active_power).state >= 0.0f ? 1.0f : -1.0f;

      # ---- Netfrequentie (Hz) - niet in P1-telegram, vaste waarde ----
      - address: 0x0046
        value_type: FP32
        read_lambda: return 50.0f;

      # ---- Totale import-/exportenergie (kWh), cumulatief oplopend ----
      - address: 0x0048
        value_type: FP32
        read_lambda: return id(total_import_energy).state;
      - address: 0x004A
        value_type: FP32
        read_lambda: return id(total_export_energy).state;

  # ---- Lijn-lijnspanningen (V) - berekend uit de drie fasespanningen
      # met de cosinusregel, uitgaande van 120° faseverschuiving tussen de
      # fasen (geldt vrijwel altijd op een normale netaansluiting; alleen
      # de amplitude verschilt in de praktijk tussen fasen, de hoek niet):
      #   V12 = sqrt(V1^2 + V2^2 + V1*V2)
      # Bij V1=V2=V3 komt dit exact overeen met de bekende V*sqrt(3)
      # benadering, maar blijft ook kloppen bij lichte onderlinge
      # amplitudeverschillen tussen de fasen (zoals in de praktijk normaal
      # is, bv. 235.9 / 233.3 / 235.7 V). Nog steeds een berekening, geen
      # echte lijn-lijnmeting.
      - address: 0x00C8
        value_type: FP32
        read_lambda: |-
          float v1 = id(voltage_l1).state;
          float v2 = id(voltage_l2).state;
          return sqrtf(v1 * v1 + v2 * v2 + v1 * v2);
      - address: 0x00CA
        value_type: FP32
        read_lambda: |-
          float v2 = id(voltage_l2).state;
          float v3 = id(voltage_l3).state;
          return sqrtf(v2 * v2 + v3 * v3 + v2 * v3);
      - address: 0x00CC
        value_type: FP32
        read_lambda: |-
          float v3 = id(voltage_l3).state;
          float v1 = id(voltage_l1).state;
          return sqrtf(v3 * v3 + v1 * v1 + v3 * v1);

      # ---- Totale energie (import + export, kWh) ----
      - address: 0x0156
        value_type: FP32
        read_lambda: |-
          return id(total_import_energy).state + id(total_export_energy).state;


# -----------------------------------------------------------------------
# Sensoren
# -----------------------------------------------------------------------
sensor:
  # ---- Bronsensoren: rechtstreeks uit Home Assistant (P1-meter) ----
  - platform: homeassistant
    id: ha_power_consumption
    entity_id: ${ha_power_consumption}
    name: "_HA Vermogen verbruik (totaal)"
    unit_of_measurement: "W"
    device_class: power
    internal: true
  - platform: homeassistant
    id: ha_power_production
    entity_id: ${ha_power_production}
    name: "_HA Vermogen teruglevering (totaal)"
    unit_of_measurement: "W"
    device_class: power
    internal: true

  - platform: homeassistant
    id: ha_power_consumption_l1
    entity_id: ${ha_power_consumption_l1}
    name: "_HA Vermogen verbruik L1"
    unit_of_measurement: "W"
    device_class: power
    internal: true
  - platform: homeassistant
    id: ha_power_consumption_l2
    entity_id: ${ha_power_consumption_l2}
    name: "_HA Vermogen verbruik L2"
    unit_of_measurement: "W"
    device_class: power
    internal: true
  - platform: homeassistant
    id: ha_power_consumption_l3
    entity_id: ${ha_power_consumption_l3}
    name: "_HA Vermogen verbruik L3"
    unit_of_measurement: "W"
    device_class: power
    internal: true

  - platform: homeassistant
    id: ha_power_production_l1
    entity_id: ${ha_power_production_l1}
    name: "_HA Vermogen teruglevering L1"
    unit_of_measurement: "W"
    device_class: power
    internal: true
  - platform: homeassistant
    id: ha_power_production_l2
    entity_id: ${ha_power_production_l2}
    name: "_HA Vermogen teruglevering L2"
    unit_of_measurement: "W"
    device_class: power
    internal: true
  - platform: homeassistant
    id: ha_power_production_l3
    entity_id: ${ha_power_production_l3}
    name: "_HA Vermogen teruglevering L3"
    unit_of_measurement: "W"
    device_class: power
    internal: true

  - platform: homeassistant
    id: voltage_l1
    entity_id: ${ha_voltage_l1}
    name: "_HA Spanning L1"
    unit_of_measurement: "V"
    device_class: voltage
    internal: true
  - platform: homeassistant
    id: voltage_l2
    entity_id: ${ha_voltage_l2}
    name: "_HA Spanning L2"
    unit_of_measurement: "V"
    device_class: voltage
    internal: true
  - platform: homeassistant
    id: voltage_l3
    entity_id: ${ha_voltage_l3}
    name: "_HA Spanning L3"
    unit_of_measurement: "V"
    device_class: voltage
    internal: true

  - platform: homeassistant
    id: current_l1
    entity_id: ${ha_current_l1}
    name: "_HA Stroom L1"
    unit_of_measurement: "A"
    device_class: current
    internal: true
  - platform: homeassistant
    id: current_l2
    entity_id: ${ha_current_l2}
    name: "_HA Stroom L2"
    unit_of_measurement: "A"
    device_class: current
    internal: true
  - platform: homeassistant
    id: current_l3
    entity_id: ${ha_current_l3}
    name: "_HA Stroom L3"
    unit_of_measurement: "A"
    device_class: current
    internal: true

  - platform: homeassistant
    id: ha_energy_consumption_t1
    entity_id: ${ha_energy_consumption_t1}
    name: "_HA Energie verbruik T1"
    unit_of_measurement: "kWh"
    device_class: energy
    internal: true
  - platform: homeassistant
    id: ha_energy_consumption_t2
    entity_id: ${ha_energy_consumption_t2}
    name: "_HA Energie verbruik T2"
    unit_of_measurement: "kWh"
    device_class: energy
    internal: true
  - platform: homeassistant
    id: ha_energy_production_t1
    entity_id: ${ha_energy_production_t1}
    name: "_HA Energie teruglevering T1"
    unit_of_measurement: "kWh"
    device_class: energy
    internal: true
  - platform: homeassistant
    id: ha_energy_production_t2
    entity_id: ${ha_energy_production_t2}
    name: "_HA Energie teruglevering T2"
    unit_of_measurement: "kWh"
    device_class: energy
    internal: true

  # ---- Afgeleide waarden per fase (verbruik minus teruglevering, in W) ----
  - platform: template
    id: active_power_l1
    name: "_HA Actief vermogen L1"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float c = id(ha_power_consumption_l1).state;
      float p = id(ha_power_production_l1).state;
      ESP_LOGD("debug_l1", "consumption=%.3f production=%.3f", c, p);
      if (std::isnan(c) || std::isnan(p)) {
        ESP_LOGW("debug_l1", "NaN input, keeping previous value");
        return {};
      }
      return (c - p);
    internal: true

  - platform: template
    id: active_power_l2
    name: "_HA Actief vermogen L2"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float c = id(ha_power_consumption_l2).state;
      float p = id(ha_power_production_l2).state;
      ESP_LOGD("debug_l2", "consumption=%.3f production=%.3f", c, p);
      if (std::isnan(c) || std::isnan(p)) {
        ESP_LOGW("debug_l2", "NaN input, keeping previous value");
        return {};
      }
      return (c - p);
    internal: true

  - platform: template
    id: active_power_l3
    name: "_HA Actief vermogen L3"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float c = id(ha_power_consumption_l3).state;
      float p = id(ha_power_production_l3).state;
      ESP_LOGD("debug_l3", "consumption=%.3f production=%.3f", c, p);
      if (std::isnan(c) || std::isnan(p)) {
        ESP_LOGW("debug_l3", "NaN input, keeping previous value");
        return {};
      }
      return (c - p);
    internal: true


  # ---- Totaal actief vermogen (W); positief = import, negatief = export ----
  # AANGEPAST VOOR EPLUCON die geinverteerde waarde verwacht. 
  # Negatief voor levering en positief voor teruglevering
  # voor eplucon is dit omgedraaid orgineel is return (c - p);
  - platform: template
    id: total_active_power
    name: "_HA Totaal vermogen"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float c = id(ha_power_consumption).state;
      float p = id(ha_power_production).state;
      ESP_LOGD("debug_total", "consumption=%.3f production=%.3f", c, p);
      if (std::isnan(c) || std::isnan(p)) {
        ESP_LOGW("debug_total", "NaN input, keeping previous value");
        return {};
      }
      return (p - c);

    internal: true

  # ---- Cumulatieve import-/exportenergie (kWh) = som van de 2 tarieven ----
  - platform: template
    id: total_import_energy
    name: "_HA Totaal import energie"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      float t1 = id(ha_energy_consumption_t1).state;
      float t2 = id(ha_energy_consumption_t2).state;
      if (std::isnan(t1) || std::isnan(t2)) {
        ESP_LOGW("debug_import_energy", "NaN input (t1=%.3f t2=%.3f), keeping previous value", t1, t2);
        return {};
      }
      return t1 + t2;
    internal: true

  - platform: template
    id: total_export_energy
    name: "_HA Totaal export energie"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      float t1 = id(ha_energy_production_t1).state;
      float t2 = id(ha_energy_production_t2).state;
      if (std::isnan(t1) || std::isnan(t2)) {
        ESP_LOGW("debug_export_energy", "NaN input (t1=%.3f t2=%.3f), keeping previous value", t1, t2);
        return {};
      }
      return t1 + t2;
    internal: true


button:
  - platform: restart
