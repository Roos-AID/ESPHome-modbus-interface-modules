button:  
  - platform: restart
    name: "_Restart device"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: _IP-adres
      icon: mdi:ip-network
    ssid:
      name: _Netwerk
      icon: mdi:access-point-network
    mac_address:
      name: _Mac-adres
      icon: mdi:folder-key-network-outline
      
  - platform: template
    name: "_Config Version"
    icon: "mdi:label-outline"
    update_interval: 6h
    lambda: return {"${version}"};
      
  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true


interval:
  - interval: 3000ms
    then:
      - output.turn_on: statusLED
      - delay: 150ms
      - output.turn_off: statusLED


