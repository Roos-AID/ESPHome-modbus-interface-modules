substitutions:
  device_name: "kwhmeters-mk"
  device_friendlyname: kWhmeters
  device_description: kWh meters meterkast
  version: "v26.05.15"

esphome:
  name: ${device_name}
  comment: "${device_description}" 
  name_add_mac_suffix: false
  friendly_name: "${device_friendlyname}"

esp32:
  # board: esp32-c6-devkitc-1
  flash_size: 4MB
  variant: ESP32C6
  toolchain: esp-idf  # or 'platformio' (default)
  framework:
    type: esp-idf

# Enable logging
logger:
  # level: VERBOSE
  level: INFO
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pw

wifi:
  min_auth_mode: WPA2
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ABBkWhmeterFallbackHotspot"
    password: "xnHq7X8a5REk"

web_server:

captive_portal:

# improv_serial:

# Internal connections COSMAX13487EESA (MAX13487E‑compatible) — Half‑duplex RS485/RS422 transceiver with automatic direction control
# ESP32‑C6 PIN	RS485 TRANSCEIVER PIN
# GPIO4	nSHDN  Shutdown. Drive SHDN high to let the device operate in normal operation. Drive SHDN low to put the part in shutdown.
# GPIO5	nEN Receiver Output Enable. Drive RE low to enable the RO. Drive RE high to let the AutoDirection circuit control the receiver.
# GPIO6	RO Receiver Output. When receiver is enabled and V(A) - V(B) > +200mV, RO is high. If V(A) - V(B)< -200mV, RO is low.
# GPIO7	DI Driver Input. Drive DI low to force noninverting output low and inverting output high. Drive DI high to
# force noninverting output high and inverting output low. DI is an input to the internal state machine that automatically enables and disables the driver. 

output:
  # Heartbeat status LED
  - platform: gpio
    id: statusLED
    pin: GPIO19
  # - platform: gpio
  #   id: ENABLE_PIN # Receiver Output Enable
  #   pin:
  #     number: GPIO5
  #     inverted: true
  - platform: gpio
    id: SHDN_PIN # Shutdown RS-485 chip
    pin:
      number: GPIO4
      inverted: true


uart:
  debug:
    # direction: BOTH
    # dummy_receiver: false
    # debug_prefix: "[MODBUS] "
    # after:
    #   bytes: 255
    # sequence:
    #   - lambda: UARTDebug::log_hex(direction, bytes, ' ', debug_prefix);  
  id: modbus_uart
  rx_pin: GPIO6
  tx_pin: GPIO7
  flow_control_pin: GPIO5  # Alleen op ESP32 
  baud_rate: 19200
  stop_bits: 1
  parity: NONE

modbus:
  id: modbus1
  # flow_control_pin: GPIO5  Niet op ESP32
  uart_id: modbus_uart
  send_wait_time: 2000ms
  # turnaround_time: 200ms
  
    

modbus_controller:
  - id: abb_b23_hoofd
    address: 1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 20s
    command_throttle: 5ms

  - id: abb_b23_hoofd_slow
    address: 1
    modbus_id: modbus1
    setup_priority: -20
    update_interval: 120s
    command_throttle: 5ms

  - id: abb_b23_bkup
    address: 2
    modbus_id: modbus1
    update_interval: 20s
    setup_priority: -30
    command_throttle: 100ms

  - id: abb_b23_bkup_slow
    address: 2
    modbus_id: modbus1
    setup_priority: -40
    update_interval: 120s
    command_throttle: 5ms


