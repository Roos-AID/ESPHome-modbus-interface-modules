# =============================================================================
# ESPHome ESP32-C6 config: RS-485 serial proxy voor Home Assistant
substitutions:
  device_name: "modbus-serialproxy"
  device_friendlyname: Serial Modbus Proxy
  device_description: HA to interface with Modbus device through serial proxy
  version: "v26.10.13"
  # Modbus-adres en baudrate
  modbus_address: "1"
  baudrate: "19200"   
#
# WAT DOET DIT?
# Stelt de RS-485 bus via de ESPHome API beschikbaar als seriele poort voor
# Home Assistant (serial proxy). Een HA-integratie (bv. Janitza) praat zelf
# Modbus RTU over deze poort; de ESP stuurt alleen bytes door.
# Baudrate/pariteit/stopbits hieronder gelden alleen tot HA verbindt: de
# integratie stelt de UART daarna zelf in (Janitza: 8N1 + opgegeven baudrate).
# =============================================================================



  # Internal connections COSMAX13487EESA (MAX13487E‑compatible) — Half‑duplex RS485/RS422 transceiver with automatic direction control
  # ESP32‑C6 PIN	RS485 TRANSCEIVER PIN
  # GPIO4	nSHDN  Shutdown. Drive SHDN high to let the device operate in normal operation. Drive SHDN low to put the part in shutdown.
  # GPIO5	nEN Receiver Output Enable. Drive RE low to enable the RO. Drive RE high to let the AutoDirection circuit control the receiver.
  # GPIO6	RO Receiver Output. When receiver is enabled and V(A) - V(B) > +200mV, RO is high. If V(A) - V(B)< -200mV, RO is low.
  # GPIO7	DI Driver Input. Drive DI low to force noninverting output low and inverting output high. Drive DI high to
  # force noninverting output high and inverting output low. DI is an input to the internal state machine that automatically enables and disables the driver.

  # uart_tx_pin: "GPIO7"
  # uart_rx_pin: "GPIO6"
  # uart_flowctrl_pin: "GPIO5"  # directly coded on UART !



esphome:
  name: ${device_name}
  comment: "${device_description}"
  name_add_mac_suffix: false
  friendly_name: "${device_friendlyname}"

esp32:
  # board: esp32-c6-devkitc-1
  flash_size: 4MB
  variant: ESP32C6
  # toolchain: esp-idf  # or 'platformio' (default)
  framework:
    type: esp-idf

# Enable logging
# level hier is het GECOMPILEERDE plafond: logger.set_level (bv. via de
# "_Debug logging AAN/UIT" knoppen) kan dit runtime alleen omlaag/omhoog
# zetten TOT AAN dit plafond, niet erboven. Staat dit op INFO, dan worden
# ESP_LOGD/ESP_LOGW-regels bij het compileren volledig weggelaten en kan
# geen enkele runtime-actie ze nog zichtbaar maken. Zet daarom DEBUG (of
# VERY_VERBOSE) tijdens troubleshooten; zet terug naar INFO en herflash
# zodra alles werkt om flash-ruimte/CPU te besparen.

logger:
  level: VERBOSE
  initial_level: ERROR
  baud_rate: 0
  logs:
    modbus: ERROR
    uart_debug: ERROR


# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  min_auth_mode: WPA2
  # Geen WiFi-energiebesparing: scheelt latentie op elk Modbus-verzoek en
  # -antwoord dat via de proxy gaat.
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_friendlyname} FB"
    password: !secret wifi_password

web_server:
  # Toont ook 'internal: true'-entiteiten op de lokale webpagina, zonder
  # ze aan Home Assistant/de API bloot te stellen (voorkomt extra
  # entiteiten in HA voor de ruwe HA-bronsensoren hieronder).
  include_internal: true
  version: 3

captive_portal:


output:
  # Heartbeat status LED
  - platform: gpio
    id: statusLED
    pin: GPIO19
  - platform: gpio
    id: SHDN_PIN # Shutdown RS-485 chip
    pin:
      number: GPIO4
      inverted: true
  

# -----------------------------------------------------------------------
# RS485 serial proxy
# -----------------------------------------------------------------------
uart:
  id: uart_modbus
  tx_pin: GPIO7
  rx_pin: GPIO6
  baud_rate: ${baudrate}
  data_bits: 8
  stop_bits: 1
  parity: EVEN
  # GPIO5 = nEN (RE) van de transceiver. ESP-IDF RS-485 half-duplex modus:
  # laag tijdens ontvangen, hoog tijdens zenden, zodat de AutoDirection de
  # ontvanger uitschakelt en de eigen verzonden bytes niet als echo naar HA
  # teruggaan. Blijft actief als HA de UART-instellingen wijzigt.
  flow_control_pin: GPIO5
  # Grootste Janitza-antwoord is 141 bytes; ruimte voor marge.
  rx_buffer_size: 512
  debug:
    direction: BOTH
    after:
      timeout: 200ms

# Expose the RS-485 port to API clients (e.g. Home Assistant).
# The client can reconfigure baud rate, data bits, stop bits
# and parity at runtime.
serial_proxy:
  - id: rs485_proxy
    uart_id: uart_modbus
    name: RS-485
    port_type: RS485
    # rts_pin:
    #   number: GPIO5

switch:

  - platform: template
    name: "_Logging UART raw byte"
    icon: "mdi:chip"
    optimistic: true
    turn_on_action:
      - logger.set_level:
          level: DEBUG
          tag: uart_debug
    turn_off_action:
      - logger.set_level:
          level: WARN
          tag: uart_debug
    entity_category: config



button:
  - platform: restart
    name: "_Restart device"    
   
text_sensor:
  - platform: wifi_info
    ip_address:
      name: _IP-adres
      icon: mdi:ip-network
    ssid:
      name: _Netwerk
      icon: mdi:access-point-network
    mac_address:
      name: _Mac-adres
      icon: mdi:folder-key-network-outline

  - platform: template
    name: "_Config Version"
    icon: "mdi:label-outline"
    update_interval: 6h
    lambda: return {"${version}"};

  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true


interval:
  - interval: 3000ms
    then:
      - output.turn_on: statusLED
      - delay: 150ms
      - output.turn_off: statusLED
